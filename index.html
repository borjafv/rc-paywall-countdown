<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Countdown</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  /* Fill the web_view host iframe; align the label to match the original node. */
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; }
  #label {
    font-family: -apple-system, system-ui, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    line-height: 1;
  }
</style>
</head>
<body>
  <div id="wrap"><span id="label"></span></div>
  <!-- External script: RC's web-bundle CSP is `script-src 'self' …` with no
       'unsafe-inline', so an inline <script> is blocked. A same-origin file is allowed. -->
  <script src="countdown.js"></script>
</body>
</html>
